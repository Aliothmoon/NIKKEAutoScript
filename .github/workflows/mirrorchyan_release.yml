name: mirrorchyan_release

# Release 发布后，把整包 NKAS_*_full-cn.7z（解开后重新打包为 zip）上传到 Mirror酱 资源
# NIKKEAutoScript，供新安装和启动器更新；源码热更新见 mirrorchyan_source.yml。
# 需要的 secrets（Settings -> Secrets and variables -> Actions）：
#   MirrorChyanUploadToken：Mirror酱 上传 token，需包含 NIKKEAutoScript；未配置时跳过（如 fork）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload, the latest release by default'
        default: ''
        required: false
  release:
    types: [published]

permissions:
  contents: read
  # the action opens an issue when the upload fails
  issues: write

jobs:
  mirrorchyan:
    runs-on: macos-latest
    env:
      UPLOAD_TOKEN: ${{ secrets.MirrorChyanUploadToken }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            filename: 'NKAS_*_full-cn.7z'

    steps:
      - name: Skip without upload token
        if: env.UPLOAD_TOKEN == ''
        run: echo "MirrorChyanUploadToken is not set, skip uploading"

      - uses: MirrorChyan/uploading-action@v1
        if: env.UPLOAD_TOKEN != ''
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          p7zip: true
          mirrorchyan_rid: NIKKEAutoScript
          tag: ${{ inputs.tag || github.event.release.tag_name }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ env.UPLOAD_TOKEN }}

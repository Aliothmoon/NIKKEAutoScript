name: mirrorchyan_release

# secrets: MirrorChyanUploadToken

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  mirrorchyan:
    runs-on: macos-latest
    env:
      UPLOAD_TOKEN: ${{ secrets.MirrorChyanUploadToken }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            filename: 'NKAS_*_full-cn.7z'

    steps:
      - name: Skip without upload token
        if: env.UPLOAD_TOKEN == ''
        run: echo "MirrorChyanUploadToken is not set, skip uploading"

      - uses: MirrorChyan/uploading-action@v1
        if: env.UPLOAD_TOKEN != ''
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          p7zip: true
          mirrorchyan_rid: NIKKEAutoScript
          tag: ${{ inputs.tag || github.event.release.tag_name }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ env.UPLOAD_TOKEN }}
